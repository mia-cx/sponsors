name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      retry_release_commit:
        description: Retry the deployment of this 40-character release merge commit
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Ordinary pushes must not replace a queued release merge.
  group: release-${{ inputs.retry_release_commit || github.sha }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release: ${{ steps.target.outputs.release }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Pushes made with the default token don't start CI, so the version PR would never get checks.
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release
      - name: Identify a merged version pull request
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_SHA: ${{ inputs.retry_release_commit }}
        run: |
          sha="${RETRY_SHA:-$GITHUB_SHA}"
          if [ -n "$RETRY_SHA" ]; then
            if ! [[ "$RETRY_SHA" =~ ^[a-f0-9]{40}$ ]]; then
              echo 'retry_release_commit must be a full commit SHA' >&2
              exit 1
            fi
            git cat-file -e "$RETRY_SHA^{commit}"
            git merge-base --is-ancestor "$RETRY_SHA" origin/main
          fi
          release="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" --paginate --slurp | node .github/scripts/release-merge.mjs "$sha" "$GITHUB_REPOSITORY")"
          if [ -n "$RETRY_SHA" ]; then test "$release" = true; fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "release=$release sha=$sha"
      - name: Open or update the version pull request
        if: inputs.retry_release_commit == ''
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          # The release token, so CI runs on the version PR; v2 rejects a GITHUB_TOKEN env that differs from this.
          github-token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          version-script: pnpm release:version
          commit-message: 'chore(release): version sponsors'
          pr-title: 'chore(release): version sponsors'
          pr-base-branch: main
          create-github-releases: false
          push-git-tags: false

  deploy:
    name: Deploy sponsors.mia.cx
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 492214885e7a580ccc1d141dfdb4dc5f
      RELEASE_SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Set the CLOUDFLARE_API_TOKEN secret (run scripts/setup-ci.sh) so CI can deploy.'
            exit 1
          fi
          pnpm build
          # Additive migrations first, so the new Worker never reads a table that doesn't exist yet.
          pnpm exec wrangler d1 migrations apply DB --remote
          pnpm exec wrangler deploy --message "Release $RELEASE_SHA"
      - name: Tag and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          # Retries reuse the existing release instead of failing on it.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already released"
            exit 0
          fi
          node .github/scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$RELEASE_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" --latest
